---
- name: Create unprivileged application login roles on the primary
  community.postgresql.postgresql_user:
    login_unix_socket: /run/pg-ha-patroni
    login_port: "{{ pg_port }}"
    name: "{{ item.name }}"
    password: "{{ item.password }}"
    role_attr_flags: LOGIN,NOSUPERUSER,NOCREATEDB,NOCREATEROLE,NOREPLICATION,NOBYPASSRLS
  loop: "{{ vault_app_users }}"
  become_user: postgres
  delegate_to: "{{ cluster.bootstrap_host }}"
  run_once: true
  no_log: true

- name: Create explicitly requested application databases
  community.postgresql.postgresql_db:
    login_unix_socket: /run/pg-ha-patroni
    login_port: "{{ pg_port }}"
    name: "{{ item.name }}"
    owner: "{{ item.owner }}"
    encoding: UTF8
  loop: "{{ application_databases }}"
  become_user: postgres
  delegate_to: "{{ cluster.bootstrap_host }}"
  run_once: true

- name: Read exact SCRAM verifiers from PostgreSQL using parameterized SQL
  community.postgresql.postgresql_query:
    login_unix_socket: /run/pg-ha-patroni
    login_port: "{{ pg_port }}"
    query: SELECT rolname, rolpassword FROM pg_authid WHERE rolname = %s
    positional_args:
      - "{{ item }}"
  loop: "{{ vault_app_users | map(attribute='name') | list }}"
  register: scram_queries
  become_user: postgres
  delegate_to: "{{ cluster.bootstrap_host }}"
  run_once: true
  no_log: true

- name: Collect the exact application credential rows
  ansible.builtin.set_fact:
    scram_result:
      query_result: "{{ scram_queries.results | map(attribute='query_result') | flatten }}"
  no_log: true

- name: Summarize credential validity without exposing authentication material
  ansible.builtin.set_fact:
    pool_credentials_valid: "{{ (scram_result.query_result | length == vault_app_users | length) and (scram_result.query_result | selectattr('rolpassword', 'match', '^SCRAM-SHA-256[$]') | list | length == vault_app_users | length) }}"
  no_log: true

- name: Require SCRAM verifiers for every application role
  ansible.builtin.assert:
    that:
      - pool_credentials_valid | bool
    fail_msg: Application role count or SCRAM credential format does not match the requested policy.

- name: Install the exact matching PgBouncer SCRAM authentication file
  ansible.builtin.copy:
    backup: true
    content: "{% for user in scram_result.query_result %}\"{{ user.rolname }}\" \"{{ user.rolpassword }}\"\n{% endfor %}"
    dest: /etc/pg-ha/pgbouncer/userlist.txt
    owner: pgbouncer
    group: pgbouncer
    mode: '0600'
  no_log: true
  diff: false

- name: Validate and install pool configuration
  ansible.builtin.template:
    backup: true
    src: pgbouncer.ini.j2
    dest: /etc/pg-ha/pgbouncer/pgbouncer.ini
    owner: pgbouncer
    group: pgbouncer
    mode: '0600'
    validate: /usr/local/libexec/pg-ha/validate-config pgbouncer %s

- name: Install PgBouncer unit
  ansible.builtin.template:
    backup: true
    src: pg-ha-pgbouncer.service.j2
    dest: /etc/systemd/system/pg-ha-pgbouncer.service
    owner: root
    group: root
    mode: '0644'

- name: Validate the PgBouncer systemd unit before activation
  ansible.builtin.command:
    argv: [/usr/bin/systemd-analyze, verify, /etc/systemd/system/pg-ha-pgbouncer.service]
  changed_when: false

- name: Activate pooler after PostgreSQL and credentials are ready
  ansible.builtin.systemd_service:
    name: pg-ha-pgbouncer
    daemon_reload: true
    enabled: true
    state: started

- name: Verify actual authenticated SQL through every local pool/database
  community.postgresql.postgresql_query:
    login_host: "{{ node.dns_name }}"
    login_port: "{{ pool_port }}"
    login_db: "{{ item.name }}"
    login_user: "{{ item.owner }}"
    login_password: "{{ (vault_app_users | selectattr('name', 'equalto', item.owner) | first).password }}"
    ssl_mode: verify-full
    ca_cert: /etc/pg-ha/pgbouncer/ca.pem
    query: SELECT pg_is_in_recovery() AS recovery
  loop: "{{ application_databases }}"
  register: pool_probe
  retries: 30
  delay: 2
  until: pool_probe is succeeded
  no_log: true
