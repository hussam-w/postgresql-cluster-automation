---
# Copy to inventories/local/discovery.yml. Replace nulls before observation.
all:
  children:
    target_vms:
      vars:
        ansible_user: null
        ansible_port: '{{ discovery_ssh_port }}'
        discovery_ssh_port: 22
        discovery_privileged: false
        ssh_authentication_method: password
        discovery_expected_management_ips: [] # Fill with the exact approved target IPs.
      hosts:
        vm1:
          ansible_host: null
          management_ip: null # Same reachable address as ansible_host.
          expected_hostname: null # Obtain from trusted provisioning records.
          intended_roles: {node: null, postgresql: null, patroni: null, etcd: null, haproxy: null, pgbouncer: null, keepalived: null}
