---
# Overlay onto your complete HA inventory policy. No addresses are inferred.
postgresql_version: '17'
primary_node: pg1
replica_nodes: [] # Read-only replicas, excluded from automatic promotion.
standby_nodes: [pg2, pg3] # Promotion-eligible streaming standbys.
replica_count: 0 # Counts are assertions against the explicit host lists.
standby_count: 2
enable_backup: false
enable_haproxy: true # false requires an empty routers inventory group.
allow_degraded_topology: false
backup_target_path: null # Required only when backup is enabled; per-host override allowed.
backup_schedule: '*-*-* 02:15:00 UTC'
postgresql_extensions: [] # plpgsql baseline stays installed.
postgresql_extension_registry: {} # Optional approved package/preload/dependency descriptors.
postgresql_deployment:
  mode: cluster
  architecture: modular
  major: '{{ postgresql_version }}'
  allow_degraded_topology: '{{ allow_degraded_topology }}'
  topology:
    primary_count: 1 # One writable primary per physical replication cluster.
    primary: '{{ primary_node }}'
    replicas: '{{ replica_nodes }}'
    standby: '{{ standby_nodes }}'
    replica_count: '{{ replica_count }}'
    standby_count: '{{ standby_count }}'
  components:
    backup: '{{ enable_backup }}'
    haproxy: '{{ enable_haproxy }}'
  extensions: '{{ postgresql_extensions }}'
  extension_registry: '{{ postgresql_extension_registry }}'
  extension_databases: [postgres]
postgresql_operation: plan
# Existing cluster policy must match these names and chosen durability mode.
# With zero eligible standbys: use async, synchronous_node_count: 0 and explicit
# acknowledge_async_data_loss: true in cluster.replication; no automatic HA claim.
