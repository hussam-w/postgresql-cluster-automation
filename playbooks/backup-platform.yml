---
- name: Require explicit scope before legacy changes
  ansible.builtin.import_playbook: maintenance-gate.yml
  vars:
    guarded_operation: backup-platform

- name: Resolve optional storage layout before backup configuration
  ansible.builtin.import_playbook: storage-resolve.yml

- name: Install encrypted backup transport and archive integration before cluster bootstrap
  hosts: postgres_cluster
  gather_facts: false
  become: true
  any_errors_fatal: true
  roles:
    - common
    - backup
