---
- name: Require explicit scope before legacy changes
  ansible.builtin.import_playbook: maintenance-gate.yml
  vars:
    guarded_operation: ip-migration-gateway-refresh

- name: Refresh etcd HTTP gateway after address and certificate changes
  hosts: postgres_cluster
  serial: 1
  gather_facts: false
  become: true
  any_errors_fatal: true
  roles: [common]
  tasks:
    - name: Require healthy majority before touching a voter
      ansible.builtin.command:
        argv: ['{{ etcd_binary_dir }}/etcdctl', '--endpoints=https://{{ node.dns_name }}:{{ cluster.ports.etcd_client }}', --cacert=/etc/pg-ha/etcd/ca.pem, --cert=/etc/pg-ha/etcd/cert.pem, --key=/etc/pg-ha/etcd/key.pem, endpoint, health, --cluster]
      changed_when: false
    - name: Probe the HTTP gateway used by Patroni separately from native gRPC
      ansible.builtin.uri:
        url: 'https://{{ node.dns_name }}:2379/v3/cluster/member/list'
        method: POST
        body_format: json
        body: {}
        ca_path: /etc/pg-ha/dcs/ca.pem
        client_cert: /etc/pg-ha/dcs/cert.pem
        client_key: /etc/pg-ha/dcs/key.pem
        use_proxy: false
        timeout: 5
      failed_when: false
      register: gateway_before
    - name: Recreate only this voter's gateway with final certificate and listener state
      ansible.builtin.systemd_service:
        name: pg-ha-etcd
        state: restarted
      when: gateway_before.status | default(-1) != 200
    - name: Require native gRPC quorum after voter restart
      ansible.builtin.command:
        argv: ['{{ etcd_binary_dir }}/etcdctl', '--endpoints=https://{{ node.dns_name }}:{{ cluster.ports.etcd_client }}', --cacert=/etc/pg-ha/etcd/ca.pem, --cert=/etc/pg-ha/etcd/cert.pem, --key=/etc/pg-ha/etcd/key.pem, endpoint, health, --cluster]
      changed_when: false
      register: refreshed_gateway_quorum
      retries: 20
      delay: 2
      until: refreshed_gateway_quorum.rc == 0
    - name: Require authenticated HTTP gateway member listing
      ansible.builtin.uri:
        url: 'https://{{ node.dns_name }}:2379/v3/cluster/member/list'
        method: POST
        body_format: json
        body: {}
        ca_path: /etc/pg-ha/dcs/ca.pem
        client_cert: /etc/pg-ha/dcs/cert.pem
        client_key: /etc/pg-ha/dcs/key.pem
        use_proxy: false
        timeout: 5
      register: gateway_after
      retries: 6
      delay: 2
      until: gateway_after.status == 200
    - name: Record gateway recovery evidence
      ansible.builtin.copy:
        backup: true
        content: "{{ {'before_status': gateway_before.status | default(-1), 'after_status': gateway_after.status, 'membership': gateway_after.json} | to_nice_json }}"
        dest: '{{ playbook_dir }}/../artifacts/ip-migration-gateway-{{ inventory_hostname }}.json'
        mode: '0600'
      delegate_to: localhost
      become: false
