---
- name: Require explicit scope before legacy changes
  ansible.builtin.import_playbook: maintenance-gate.yml
  vars:
    guarded_operation: platform

- name: Provision explicitly selected platform resources one node at a time
  hosts: postgres_cluster
  gather_facts: true
  serial: 1
  become: true
  any_errors_fatal: true
  roles:
    - platform
