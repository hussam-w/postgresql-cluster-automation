---
- name: Require explicit scope before legacy changes
  ansible.builtin.import_playbook: maintenance-gate.yml
  vars:
    guarded_operation: recovery-acceptance

- name: Prove isolated recovery of application data
  ansible.builtin.import_playbook: restore-verify.yml
- name: Enable the validated recovery schedule
  ansible.builtin.import_playbook: backup-schedule.yml
- name: Enable continuous functional health checks
  ansible.builtin.import_playbook: monitoring.yml
- name: Verify the complete deployment without changing it
  ansible.builtin.import_playbook: verify.yml
