---
all:
  children:
    postgres_cluster:
      hosts:
        existing-db:
          ansible_host: 192.0.2.20
          ansible_user: automation
          ansible_port: 22
          # Replace TEST-NET addressing and verify SSH identity before use.
          # No storage/network/bootstrap contract is required for inspection.
          reconcile_instances:
            - socket_dir: /var/run/postgresql
              port: 5432
              owner: postgres
              manager: observe
              parameters: {}
